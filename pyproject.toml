[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-taxonomy-transfer"
version = "0.1.0"
description = "Reproducible research on aspect detection and sentiment under taxonomy shift"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.7", "build>=1,<2", "psutil>=6,<8", "matplotlib>=3.8,<4", "seaborn>=0.13,<1"]
neural = ["torch>=2.6,<3", "transformers>=4.57,<6", "accelerate>=1,<2", "datasets>=3,<6", "tqdm>=4,<5"]
qlora = ["peft>=0.19,<1", "bitsandbytes>=0.49,<1", "trl>=0.24,<2"]

[project.scripts]
taxonomy-demo = "msc_project.demo:main"
taxonomy-results = "msc_project.reporting:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"
markers = ["neural: requires optional PyTorch or Transformers dependencies"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["outputs", "tmp", "thesis", "build", "dist"]

[tool.ruff.lint]
# Start with correctness checks across every historical and current Python file.
# The maintained interface gets the stricter profile in scripts/check_quality.py.
select = ["E9", "F63", "F7", "F82"]
